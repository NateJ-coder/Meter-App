<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b4da2">
    <title>Capture Dashboard - Fuzio Meter Readings</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/images/Fuzio logo.jpg">
    <link rel="stylesheet" href="assets/styles.css">
    <style>.dashboard-auth-pending > * { visibility: hidden; }</style>
</head>
<body class="dashboard-auth-pending">
    <nav class="navbar">
        <div class="nav-brand">
            <img src="assets/images/Fuzio logo.jpg" alt="Fuzio" class="nav-logo">
            <span>Fuzio Meter Readings</span>
        </div>
        <ul class="nav-links">
            <li><a href="capture-dashboard.html" class="active">Mobile Captures</a></li>
            <li><a href="#" id="sign-out-link">Sign Out</a></li>
        </ul>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>Mobile Capture Dashboard</h1>
            <p class="subtitle">Readings and photos captured from the Fuzio Meter Reader Android app</p>
        </header>

        <section class="card">
            <div class="filter-grid">
                <div class="form-group">
                    <label for="building-select">Building</label>
                    <select id="building-select" class="form-control">
                        <option value="Genesis">Genesis</option>
                        <option value="Phanda Lodge">Phanda Lodge</option>
                        <option>Akasia</option>
                        <option>Azores</option>
                        <option>Bonifay</option>
                        <option>Carissa Lane</option>
                        <option>Colnbrook</option>
                        <option>Dolphine Cove</option>
                        <option>Gosforth Park</option>
                        <option>Granistar Heights</option>
                        <option>Haven Court</option>
                        <option>Hazelmere</option>
                        <option>L'Montagne</option>
                        <option>Magnolia Gardens</option>
                        <option>Mang Court</option>
                        <option>New Poort</option>
                        <option>Palm View Estate</option>
                        <option>Panarama View</option>
                        <option>Queensgate</option>
                        <option>River View</option>
                        <option>Riviera Villas</option>
                        <option>Rivonia Gate</option>
                        <option>Stonecrest</option>
                        <option>Summers Ridge</option>
                        <option>Suncrest</option>
                        <option>Sundene</option>
                        <option>Taragona</option>
                        <option>Transvalia</option>
                        <option>Villino Glen</option>
                        <option>Vista Del Monte</option>
                        <option>Wesley Heights</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="month-select">Month</label>
                    <select id="month-select" class="form-control">
                        <option value="">All months</option>
                    </select>
                </div>
                <div class="form-group" style="align-self: end;">
                    <button class="btn btn-primary" id="load-btn">Load Captures</button>
                </div>
                <div class="form-group" style="align-self: end;">
                    <button class="btn btn-secondary" id="export-btn" disabled>Export to Excel</button>
                </div>
                <div class="form-group" style="align-self: end;">
                    <button class="btn btn-secondary" id="download-photos-btn" disabled>Download All Photos</button>
                </div>
                <div class="form-group" style="align-self: end;" id="install-group" hidden>
                    <button class="btn btn-secondary" id="install-btn">Install Dashboard</button>
                </div>
            </div>
            <p id="status-text" class="text-muted"></p>
        </section>

        <section class="card" style="overflow-x: auto;">
            <table class="data-table" id="captures-table">
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Meter Label</th>
                        <th>Type</th>
                        <th>Reading</th>
                        <th>Reader Review</th>
                        <th>Captured At</th>
                        <th>Photo File</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="captures-body">
                    <tr><td colspan="8" class="text-muted">Load a building to see captured readings.</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script type="module" src="assets/capture-dashboard.js"></script>
    <script src="assets/install-dashboard.js" defer></script>
</body>
</html>
