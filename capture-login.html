<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b4da2">
    <title>Office Sign In - Fuzio Meter Readings</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="assets/styles.css">
    <style>
        .login-container { width: min(100%, 420px); }
        .login-card { width: 100%; }
        .login-card input { width: 100%; }

        @media (max-width: 480px) {
            .login-body { padding: 1rem; }
            .login-card { padding: 1.5rem; }
            .login-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body class="login-body">
    <main class="login-container">
        <section class="login-card">
            <div class="login-header">
                <img src="assets/images/Fuzio logo.jpg" alt="Fuzio" class="login-logo">
                <h1>Meter Capture Office</h1>
                <p class="subtitle">Sign in with an authorized office account</p>
            </div>

            <p id="login-error" class="alert alert-danger" role="alert" hidden></p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary btn-large" style="width:100%;">Sign In</button>
            </form>
        </section>
    </main>

    <script type="module" src="assets/capture-login.js"></script>
</body>
</html>
